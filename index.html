<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dendrology Quiz & Study Guide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top App Navigation & Stats -->
  <header class="app-header">
    <div class="header-left">
      <h1>🌲 Dendrology Quiz</h1>
    </div>
    <div id="stats" class="header-stats hidden">
      <span>Score: <strong id="score">0</strong></span>
      <span>Streak: <strong id="streak">0</strong> 🔥</span>
    </div>
    <div class="header-right">
      <button id="settingsBtn" class="icon-btn" title="Quiz Settings">⚙️</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-card">
    
    <!-- 1. START SCREEN -->
    <section id="startScreen" class="screen">
      <h2>Woody Plant Identification</h2>
      <p class="subtitle">Test your knowledge across standard dendrology species and interactive 3D scans.</p>

      <!-- Mode Selection -->
      <div class="panel-section">
        <label class="section-label">Quiz Direction</label>
        <div id="modeSelect" class="btn-group">
          <button type="button" class="mode-btn active" data-mode="sci-to-common">Scientific → Common</button>
          <button type="button" class="mode-btn" data-mode="common-to-sci">Common → Scientific</button>
          <button type="button" class="mode-btn" data-mode="family">Family Lookup</button>
        </div>
      </div>

      <!-- Play Style -->
      <div class="panel-section">
        <label class="section-label">Input Style</label>
        <div id="playStyleSelect" class="btn-group">
          <button type="button" id="playStyleQuiz" class="mode-btn active">Multiple Choice</button>
          <button type="button" id="playStyleTyping" class="mode-btn">Type Answer</button>
        </div>
      </div>

      <!-- Question Count -->
      <div class="panel-section" id="countRow">
        <label class="section-label">Number of Questions</label>
        <div id="countSelect" class="btn-group">
          <button type="button" class="count-btn active" data-count="10">10</button>
          <button type="button" class="count-btn" data-count="25">25</button>
          <button type="button" class="count-btn" data-count="50">50</button>
          <button type="button" class="count-btn" data-count="100">100</button>
        </div>
      </div>

      <!-- Lab Presets -->
      <div class="panel-section">
        <label class="section-label">Lab Presets</label>
        <div class="preset-checkboxes">
          <label><input type="checkbox" id="quizTest1Toggle"> Quiz Test 1</label>
          <label><input type="checkbox" id="quizTest2Toggle"> Quiz Test 2</label>
          <label><input type="checkbox" id="quizTest3Toggle"> Quiz Test 3</label>
          <label><input type="checkbox" id="quizTest4Toggle"> Quiz Test 4</label>
          <label><input type="checkbox" id="quizTest5Toggle"> Quiz Test 5</label>
        </div>
      </div>

      <!-- Start Button -->
      <button type="button" id="startBtn" class="btn-primary" onclick="startQuiz(false)">Start 10-Question Quiz</button>
    </section>

    <!-- 2. QUIZ SCREEN -->
    <section id="quizScreen" class="screen hidden">
      <!-- Progress and Timer -->
      <div class="progress-wrap">
        <div class="progress-meta">
          <span>Question <span id="qNum">1</span> / <span id="totalQ">10</span></span>
          <span id="timerText" class="timer-tag">15</span>
        </div>
        <div class="progress-bar-bg"><div id="progressBar" class="progress-fill"></div></div>
        <div class="timer-bar-bg"><div id="timerBar" class="timer-fill"></div></div>
      </div>

      <!-- Prompt Question Area -->
      <div class="prompt-box">
        <div id="promptLabel" class="prompt-badge">Scientific Name</div>
        <div id="prompt" class="prompt-name">—</div>
      </div>

      <!-- Specimen Viewer (Diagnostic Photos & 3D Buds) -->
      <div id="mediaViewer" class="media-box">
        <div id="imageStage" class="stage">
          <img id="activePhoto" alt="Diagnostic woody specimen" class="specimen-img hidden">
          <div id="mediaLoader" class="loader-spinner"></div>
          <div id="mediaFallback" class="fallback-note">Photo will reveal on submit</div>
        </div>
        <div id="resizeBar" class="drag-handle" title="Drag to resize photo view">···</div>
      </div>

      <!-- 3D Bud Scan Spinzam Button -->
      <button type="button" id="spinzamBtn" class="btn-secondary hidden" style="width:100%; margin:8px 0; border:1px solid #68d391; color:#68d391;">
        🔄 View 3D Bud Scan (Interactive)
      </button>

      <!-- Multiple Choice Options Grid -->
      <div id="options" class="options-grid"></div>

      <!-- Typing Answer Input (Hidden by default) -->
      <div id="typeAnswerArea" class="typing-container hidden">
        <input type="text" id="typeAnswerInput" placeholder="Type tree name here..." autocomplete="off">
        <button type="button" id="typeSubmitBtn" class="btn-primary">Submit</button>
      </div>

      <!-- Feedback Area & Next -->
      <div id="feedback" class="feedback-banner hidden"></div>
      <button type="button" id="nextBtn" class="btn-primary hidden" style="margin-top:12px;">Next Question →</button>
      <button type="button" id="cancelQuizBtn" class="btn-secondary" style="margin-top:8px;">Exit Quiz</button>
    </section>

    <!-- 3. END RESULTS SCREEN -->
    <section id="endScreen" class="screen hidden">
      <h2>Quiz Complete!</h2>
      <div id="endMsg" class="score-banner">—</div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" id="startOverBtn" class="btn-primary" style="flex:1;">Play Again</button>
        <button type="button" id="homeBtn" class="btn-secondary" style="flex:1;">Home Menu</button>
      </div>
    </section>

  </main>

  <!-- Settings Modal Panel -->
  <aside id="settingsPanel" class="modal-dialog hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Quiz Settings</h3>
        <button type="button" id="closeSettingsBtn" class="modal-close">&times;</button>
      </div>
      <div class="modal-content">
        <div class="setting-row">
          <label for="timeLimitSlider">Timer (seconds): <strong id="timeLimitLabel">15s</strong></label>
          <input type="range" id="timeLimitSlider" min="5" max="60" value="15">
        </div>
        <div id="keybindList" style="margin-top:14px;"></div>
      </div>
    </div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
