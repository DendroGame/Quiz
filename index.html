<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dendrology Master Quiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-container">
    
    <!-- LEFT COLUMN: Persistent Settings & Setup Side Panel -->
    <aside class="side-panel">
      <h1>🌲 DendroMaster</h1>
      <p class="subtitle">1,250+ Species Widescreen Edition</p>

      <!-- Quiz Direction Mode -->
      <div class="panel-section">
        <label class="section-label">Quiz Direction</label>
        <div id="modeSelect" class="btn-group">
          <button type="button" class="mode-btn active" data-mode="sci-to-common">Scientific → Common</button>
          <button type="button" class="mode-btn" data-mode="common-to-sci">Common → Scientific</button>
          <button type="button" class="mode-btn" data-mode="family">Family Lookup</button>
        </div>
      </div>

      <!-- Question Count -->
      <div class="panel-section">
        <label class="section-label">Question Count</label>
        <div id="countSelect" class="btn-group">
          <button type="button" class="count-btn active" data-count="10">10 Questions</button>
          <button type="button" class="count-btn" data-count="25">25 Questions</button>
          <button type="button" class="count-btn" data-count="50">50 Questions</button>
        </div>
      </div>

      <!-- Database Scope -->
      <div class="panel-section">
        <label class="section-label">Species Scope</label>
        <button type="button" class="mode-btn active" style="width:100%; text-align:center;">All 1,250+ Species Pool</button>
      </div>

      <button type="button" id="startBtn" class="btn-primary" onclick="startQuiz()">Launch Quiz</button>
    </aside>

    <!-- RIGHT COLUMN: Main Quiz & Display Stage -->
    <main class="main-stage">
      
      <!-- START SCREEN -->
      <section id="startScreen">
        <h2>Desktop Workspace Ready</h2>
        <p class="subtitle" style="margin-top:8px;">Select your preferences on the left sidebar and click <strong>Launch Quiz</strong> to begin testing across the master dataset.</p>
      </section>

      <!-- ACTIVE QUIZ SCREEN -->
      <section id="quizScreen" class="hidden">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-size:0.85rem; color:var(--muted);">
          <span>Question <strong id="qNum">1</strong> / <strong id="totalQ">10</strong></span>
          <span>Score: <strong id="score">0</strong></span>
        </div>

        <div class="quiz-grid">
          <!-- Left Side of Quiz: Specimen Image -->
          <div class="media-box">
            <span style="color:var(--muted); font-size:0.85rem;">Specimen Photo Loading...</span>
          </div>

          <!-- Right Side of Quiz: Prompt & Options -->
          <div>
            <div id="prompt" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 16px;">—</div>
            <div id="options" class="options-grid"></div>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
